<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cruise Finder – Wolkenwanderer</title>
<meta name="description" content="Finde mit dem Wolkenwanderer Cruise Finder deine perfekte Traumroute, Reederei, Schiff und Kabine.">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#17325c">
<link rel="icon" type="image/svg+xml" href="img/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="img/icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="img/icon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="img/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cruise Finder">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Yellowtail&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="brand">
    <span class="brand-badge" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 15.5c1.5 1.2 3 1.2 4.5 0 1.5-1.2 3-1.2 4.5 0 1.5 1.2 3 1.2 4.5 0 1.5-1.2 3-1.2 4.5 0" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/>
        <path d="M6 13.5 6.8 8h10.4l.8 5.5" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/>
        <path d="M11.5 8V3.5h2.2l1.6 2.2-1.6 1v1.3" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/>
      </svg>
    </span>
    <span class="brand-name">Wolkenwanderer</span>
  </div>
  <span class="brand-tag">Cruise Finder</span>
</header>

<main>
  <div id="quiz-app" class="quiz-app"></div>
</main>

<div class="wave-deco" aria-hidden="true">
  <svg viewBox="0 0 1440 160" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M0,80 C240,20 360,140 600,80 C840,20 960,140 1200,80 C1320,50 1380,50 1440,70 L1440,160 L0,160 Z" fill="var(--wave-1)"/>
    <path d="M0,110 C240,60 420,150 660,100 C900,50 1020,150 1260,100 C1350,80 1400,80 1440,95 L1440,160 L0,160 Z" fill="var(--wave-2)"/>
    <path d="M0,135 C260,105 460,155 700,125 C940,95 1100,155 1440,125 L1440,160 L0,160 Z" fill="var(--wave-3)"/>
  </svg>
</div>

<footer class="site-footer">
  <p>Wolkenwanderer Cruise Finder · Alle Angaben zu Reedereien, Schiffen und Routen dienen als unverbindliche Orientierung.</p>
</footer>

<button id="explorer-tab" class="explorer-tab" type="button" aria-haspopup="dialog" aria-controls="explorer-panel">
  <span aria-hidden="true">⚓</span> Alle Reedereien
</button>
<div id="explorer-backdrop" class="explorer-backdrop"></div>
<aside id="explorer-panel" class="explorer-panel" role="dialog" aria-label="Reederei-Übersicht" aria-hidden="true">
  <div class="explorer-header">
    <h3>Reedereien im Überblick</h3>
    <button id="explorer-close" class="explorer-close" type="button" aria-label="Schließen">&times;</button>
  </div>
  <div id="explorer-body" class="explorer-body"></div>
</aside>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
